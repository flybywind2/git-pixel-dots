name: Build, Test & Deploy GitDots to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify pixel font glyph coverage
        run: |
          python3 -m venv "$RUNNER_TEMP/gitdots-font-check"
          "$RUNNER_TEMP/gitdots-font-check/bin/python" -m pip install 'fonttools[woff]==4.60.1'
          "$RUNNER_TEMP/gitdots-font-check/bin/python" scripts/subset-pixel-font.py --check

      - name: Run Vitest unit suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium for browser checks
        run: npx --no-install playwright-core install --with-deps --only-shell chromium

      - name: Verify the built site in Chromium
        run: npm run qa:visual

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
