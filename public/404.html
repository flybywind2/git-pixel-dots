<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>GitDots</title>
    <script>
      (function () {
        var hash = window.location.hash || '#/ch1';
        var base = window.location.pathname.replace(/[^/]*$/, '');
        window.location.replace(base + hash);
      })();
    </script>
  </head>
  <body style="background:#F6EFE2;color:#2F241D;font-family:sans-serif;">
    <p>Redirecting to GitDots...</p>
  </body>
